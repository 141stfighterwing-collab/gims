<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 794px; height: 1123px;
    background: #ebeef0;
    font-family: 'Times New Roman', Georgia, serif;
    overflow: hidden;
  }
  .cover {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    padding: 80px 60px;
    position: relative;
  }
  .top-bar {
    position: absolute; top: 0; left: 0; right: 0;
    height: 8px; background: #ce2d48;
  }
  .bottom-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 8px; background: #ce2d48;
  }
  .accent-line {
    width: 200px; height: 3px;
    background: #ce2d48;
    margin: 24px auto;
  }
  .logo-area {
    font-size: 14px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #7b8188;
    margin-bottom: 40px;
  }
  .title {
    font-size: 36px;
    font-weight: bold;
    color: #1d1f20;
    text-align: center;
    line-height: 1.3;
    margin-bottom: 10px;
  }
  .title-accent {
    font-size: 38px;
    font-weight: bold;
    color: #ce2d48;
    text-align: center;
    line-height: 1.3;
    margin-bottom: 10px;
  }
  .subtitle {
    font-size: 18px;
    color: #7b8188;
    text-align: center;
    margin-top: 16px;
    line-height: 1.5;
  }
  .meta-box {
    margin-top: 60px;
    background: #d3d9e0;
    padding: 20px 50px;
    border-radius: 4px;
    text-align: center;
  }
  .meta-box p {
    font-size: 13px;
    color: #1d1f20;
    margin: 4px 0;
  }
  .meta-label {
    color: #7b8188;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .classification {
    position: absolute;
    bottom: 30px;
    left: 0; right: 0;
    text-align: center;
    font-size: 12px;
    color: #7b8188;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .decorative-square {
    position: absolute;
    width: 120px; height: 120px;
    border: 2px solid #ce2d48;
    opacity: 0.15;
  }
  .sq1 { top: 60px; left: 60px; }
  .sq2 { bottom: 60px; right: 60px; }
</style>
</head>
<body>
<div class="cover">
  <div class="top-bar"></div>
  <div class="bottom-bar"></div>
  <div class="decorative-square sq1"></div>
  <div class="decorative-square sq2"></div>

  <div class="logo-area">Intelligence Division</div>

  <div class="title-accent">Global Intelligence</div>
  <div class="title">Monitoring System</div>
  <div class="accent-line"></div>
  <div class="subtitle">(GIMS)<br>Technical Architecture &amp; Strategic Intelligence Platform</div>

  <div class="meta-box">
    <p class="meta-label">Document Date</p>
    <p><strong>May 2026</strong></p>
    <p style="margin-top:10px;" class="meta-label">Version</p>
    <p><strong>1.0 — Final Release</strong></p>
  </div>

  <div class="classification">Unclassified // For Official Use Only</div>
</div>
</body>
</html>
